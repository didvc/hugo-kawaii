baseURL = "https://didvc.github.io/hugo-kawaii/"
locale = "en-us"
title = "Kawaii Theme Demo"
theme = "kawaii"

enableEmoji = true

[module]
  [module.hugoVersion]
    extended = true
    min = "0.147.0"

[pagination]
  pagerSize = 6

[build]
  writeStats = true

[params]
  description = "A showcase of the beautiful Kawaii Hugo theme"
  author = "didvc"

  theme_toggle = true
  search = true

  hero_cta = "Explore Demo"
  hero_cta_link = "posts/"

  footer_description = "Demonstrating the power and beauty of the Kawaii theme"
  copyright = "Demo site for Kawaii theme."

  [[params.social]]
    name = "github"
    url = "https://github.com/didvc/hugo-kawaii"

  [[params.social]]
    name = "github"
    url = "https://github.com/didvc"

  [[params.footer_links]]
    name = "Documentation"
    url = "https://github.com/didvc/hugo-kawaii#readme"

  [[params.footer_links]]
    name = "Download"
    url = "https://github.com/didvc/hugo-kawaii"

  [[params.featured_sections]]
    title = "Beautiful Design"
    description = "Experience modern web design with kawaii aesthetics and smooth animations"
    icon = "✨"
    link = "posts/"

  [[params.featured_sections]]
    title = "Developer Friendly"
    description = "Built with Hugo, easy to customize and extend for your needs"
    icon = "⚡"
    link = "https://github.com/didvc/hugo-kawaii#readme"

  [[params.featured_sections]]
    title = "Mobile First"
    description = "Responsive design that looks perfect on all devices and screen sizes"
    icon = "📱"

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 10

  [[menu.main]]
    name = "Posts"
    url = "/posts"
    weight = 20


  [[menu.main]]
    name = "About"
    url = "/about"
    weight = 30


[markup]
  [markup.highlight]
    style = "github"
    lineNos = true
    lineNumbersInTable = false
    codeFences = true
    guessSyntax = true

  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]
  section = ["HTML", "RSS"]
